[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifcplot"
version = "0.1.0"
description = "IFC-first house modeling utilities with matplotlib detail generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Colin Catlin" },
]
keywords = ["ifc", "bim", "architecture", "construction", "ifcopenshell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "ifcopenshell>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "adjustText>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/colincatlin/catlin-house"
Documentation = "https://github.com/colincatlin/catlin-house#readme"
Repository = "https://github.com/colincatlin/catlin-house"

[tool.hatch.build.targets.wheel]
packages = ["ifcplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
